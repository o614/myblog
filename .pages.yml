media:
  input: public/images/posts
  output: /images/posts
  categories: [image]
  rename: safe

content:
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{hour}-{minute}-{second}.md"
      field: false
    view:
      fields: [title, pubDatetime, draft, featured]
      primary: title
      sort: [pubDatetime, title]
      search: [title, description, tags]
      default:
        sort: pubDatetime
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: pubDatetime
        label: 发布时间
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: description
        label: 摘要
        description: 显示在文章列表和搜索结果中，写一两句话即可。
        type: text
        required: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: featured
        label: 首页精选
        type: boolean
        default: false
      - name: draft
        label: 草稿
        description: 开启后文章不会出现在公开网站。
        type: boolean
        default: true
      - name: ogImage
        label: 分享图片（可选）
        type: image
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          switcher: false

  - name: about
    label: 关于页面
    type: file
    path: src/content/pages/about.md
    format: yaml-frontmatter
    operations:
      delete: false
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 页面摘要
        type: text
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          switcher: false
